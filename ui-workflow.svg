3e46" stroke-width="2"/><text class="num" style="animation-delay:4s" x="563" y="129" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fff">03</text><text x="563" y="178" font-size="16" fill="#fff" text-anchor="middle" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-weight="600">Type-check</text><text x="563" y="200" font-size="12" fill="#8b9099" text-anchor="middle" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" >TypeScript catches the rest</text><circle class="step" style="animation-delay:6s" cx="790" cy="124" r="24" fill="#0d0f12" stroke="#3a3e46" stroke-width="2"/><text class="num" style="animation-delay:6s" x="790" y="129" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#fff">04</text><text x="790" y="178" font-size="16" fill="#fff" text-anchor="middle" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-weight="600">Ship</text><text x="790" y="200" font-size="12" fill="#8b9099" text-anchor="middle" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" >Review, deploy, repeat</text></g>
