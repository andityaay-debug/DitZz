<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310">
<style>
text{font-family:'Courier New',Courier,monospace;font-weight:700}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.press{animation:press 1s steps(1) infinite}
@keyframes press{0%{opacity:1}50%{opacity:0}}
.shim{animation:shim 3s ease-in-out infinite}
@keyframes shim{0%,100%{fill:#fff}50%{fill:#FFD60A}}
.ground{animation:gnd 1s linear infinite}
@keyframes gnd{to{stroke-dashoffset:-34}}
.shadow{animation:sh 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.6);opacity:.25}}
.grow{animation:grow 6s ease-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes grow{0%{transform:scaleX(0)}25%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}</style>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#fff" opacity=".035"/></pattern></defs>
