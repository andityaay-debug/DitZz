<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="900" height="36"><style>
.r{opacity:0;animation:r .5s ease-out forwards}
@keyframes r{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.cur{animation:cur 1.1s steps(1) infinite}
@keyframes cur{0%{opacity:1}50%{opacity:0}}
.step{animation:step 8s ease-in-out infinite}
@keyframes step{0%{fill:#0d0f12;stroke:#3a3e46}8%,30%{fill:#9ac7ff;stroke:#9ac7ff}45%,100%{fill:#0d0f12;stroke:#3a3e46}}
.num{animation:num 8s ease-in-out infinite}
@keyframes num{0%{fill:#fff}8%,30%{fill:#0a0a0a}45%,100%{fill:#fff}}
.lnk{stroke-dasharray:6 6;animation:lnk 1.2s linear infinite}
@keyframes lnk{to{stroke-dashoffset:-12}}
</style>
<defs><clipPath id="w"><rect width="900" height="36" rx="8"/></clipPath></defs>
<g clip-path="url(#w)"><rect width="900" height="36" fill="#0d0f12"/><rect width="900" height="36" fill="#9ac7ff"/><g fill="none" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round"><circle cx="22" cy="24" r="2.2"/><circle cx="22" cy="15" r="2.2"/><path d="M22 17 v5"/></g><text x="34" y="23" font-size="12" fill="#0a0a0a" text-anchor="start" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-weight="600">main</text><text x="868" y="23" font-size="12" fill="#0a0a0a" text-anchor="end" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" >built with TypeScript and Claude</text><text x="450" y="23" font-size="12" fill="#0a0a0a" text-anchor="middle" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-weight="600">thanks for visiting</text></g>
<rect x=".5" y=".5" width="899" height="35" rx="7.5" fill="none" stroke="#2a2d34"/></svg>