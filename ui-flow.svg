<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 236" width="900" height="236" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.r{opacity:0;animation:r .5s ease-out forwards}
@keyframes r{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.step{animation:step 8s ease-in-out infinite}
@keyframes step{0%{fill:#0d0f12;stroke:#3a3e46}8%,30%{fill:#9ac7ff;stroke:#9ac7ff}45%,100%{fill:#0d0f12;stroke:#3a3e46}}
.ic{animation:ic 8s ease-in-out infinite}
@keyframes ic{0%{stroke:#fff}8%,30%{stroke:#0a0a0a}45%,100%{stroke:#fff}}
.lnk{stroke-dasharray:6 6;animation:lnk 1.2s linear infinite}
@keyframes lnk{to{stroke-dashoffset:-12}}
</style>
